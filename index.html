<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10243a"><title>Supermarket Simulator 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc5dc;font-family:system-ui,Arial;touch-action:none;color:white}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}.pill{position:absolute;top:12px;padding:9px 13px;border-radius:14px;background:#101827df;border:1px solid #ffffff30;font-weight:800}#cash{left:12px}#stock{right:12px}
#hint{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#101827df;padding:8px 12px;border-radius:12px;font-size:13px;text-align:center;max-width:88vw}
#msg{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);background:#0b1424ed;padding:10px 14px;border-radius:12px;display:none;text-align:center}
#controls{position:absolute;bottom:18px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;pointer-events:auto}#stick{width:112px;height:112px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff80;position:relative;touch-action:none}#knob{position:absolute;width:46px;height:46px;border-radius:50%;background:#eef6ffdd;left:31px;top:31px}
.actions{display:flex;gap:8px}button{border:0;border-radius:14px;padding:13px 14px;background:#167ce5;color:white;font-weight:900;font-size:13px;box-shadow:0 4px 0 #084e9b}button:active{transform:translateY(2px);box-shadow:0 2px 0 #084e9b}#restock{background:#18a76b;box-shadow:0 4px 0 #087247}
#overlay{position:fixed;inset:0;background:linear-gradient(#0c1828d9,#07101df2);display:flex;align-items:center;justify-content:center;padding:22px}.panel{max-width:430px;width:100%;background:#15243a;border:1px solid #ffffff30;border-radius:24px;padding:25px;text-align:center;box-shadow:0 20px 70px #0009}.panel h1{font-size:28px;margin:0 0 8px}.panel p{color:#c5d3e4;line-height:1.5}.panel button{width:100%;padding:16px;font-size:17px;margin-top:12px}.small{font-size:12px;color:#9fb1c8}
</style></head><body><div id="hud"><div id="cash" class="pill">💵 $<span id="money">120</span></div><div id="stock" class="pill">📦 Stock: <span id="count">8</span></div><div id="hint">Explore your store • Restock shelves • Serve customers</div><div id="msg"></div><div id="controls"><div id="stick"><div id="knob"></div></div><div class="actions"><button id="restock">RESTOCK</button><button id="checkout">CHECKOUT</button></div></div></div>
<div id="overlay"><div class="panel"><h1>🛒 SUPERMARKET 3D</h1><p>Welcome to Fresh Mart! Stock shelves, serve customers and grow your supermarket.</p><p class="small">Realistic store prototype • Mobile + desktop controls</p><button id="start">OPEN THE STORE</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.createElement('canvas');document.body.insertBefore(canvas,document.body.firstChild);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9c9df);scene.fog=new THREE.Fog(0xa9c9df,24,52);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x667080,1.45));const sun=new THREE.DirectionalLight(0xfff1dc,2.4);sun.position.set(-7,13,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.72});
function makeTexture(base,detail){const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,256,256);for(let i=0;i<900;i++){g.fillStyle=detail+(Math.random()*.18+.04)+')';g.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*3)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,4);return t}
const floorMat=new THREE.MeshStandardMaterial({map:makeTexture('#c9c8c1','rgba(90,90,90,'),roughness:.32});
const metal=()=>new THREE.MeshStandardMaterial({color:'#687783',metalness:.72,roughness:.36});
function cube(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
cube(0,-.16,0,25,.3,25,floorMat);cube(0,3,-12.5,25,6,.25,material('#dfe5e8'));cube(0,6.05,0,25,.18,25,material('#f2f1eb'));cube(-12.5,3,0,.25,6,25,material('#e8edf0'));cube(12.5,3,0,.25,6,25,material('#e8edf0'));
for(let x=-9;x<=9;x+=6){cube(x,5.82,-5,3.2,.08,1.15,material('#ffffff'));cube(x,5.7,-5,2.8,.08,.8,material('#d9e5eb'));const l=new THREE.PointLight(0xfff4df,18,12);l.position.set(x,5.25,-5);scene.add(l)}
cube(0,4.6,-12.32,7,1.15,.2,material('#1765a8'));
function sign(){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='white';g.font='bold 60px Arial';g.textAlign='center';g.fillText('FRESH MART',256,83);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.scale.set(5.5,1.3,1);s.position.set(0,4.6,-12.1);scene.add(s)}sign();
const shelfSpots=[[-7,-3],[-2.5,-3],[2.5,-3],[7,-3],[-7,3],[-2.5,3],[2.5,3],[7,3]],palette=['#e94e45','#f2b92d','#49ad67','#548de1','#d36bc4'];
function productPack(x,y,z,color,kind){const m=material(color);if(kind===0){const can=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.43,16),m);can.position.set(x,y,z);can.castShadow=true;scene.add(can);const rim=new THREE.Mesh(new THREE.CylinderGeometry(.132,.132,.035,16),metal());rim.position.set(x,y+.22,z);scene.add(rim)}else{cube(x,y,z,.28,.42,.25,m);cube(x,y,z+.131,.18,.08,.008,material('#f5f1df'))}}
shelfSpots.forEach(([x,z],n)=>{cube(x,1,z,2.75,2,.95,metal());cube(x,2.06,z,2.95,.12,1.12,material('#8b6748'));for(let row=0;row<3;row++){const yy=.55+row*.65;cube(x,yy,z+.53,2.75,.055,.08,metal());for(let i=0;i<7;i++){const px=x-1.13+i*.375;productPack(px,yy+.29,z+.27,palette[(i+n+row)%palette.length],(i+n)%2)}}cube(x,2.18,z+.57,2.8,.16,.07,material('#f4f1e8'))});
cube(0,.55,8,4,.9,1.5,material('#8d6848'));cube(.8,1.05,8,1.1,.12,.8,material('#2bb17a'));cube(-1.2,1.15,8,.5,.25,.45,material('#263747'));cube(0,1.04,7.23,3.8,.06,.08,metal());cube(0,.2,8,4.1,.12,1.6,metal());
for(const x of [-8,8])cube(x,2.6,11.8,4,3,.08,material('#79bde8'));
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.8,4,8),material('#247de0'));body.position.y=.82;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,16,12),material('#e5b58d'));head.position.y=1.48;player.add(head);player.position.set(0,0,10);
const shoppers=[];['#d95d39','#8b69c9','#d0a22e'].forEach((c,i)=>{const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(.3,.72,4,8),material(c));b.position.y=.72;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),material('#d8a47f'));h.position.y=1.35;g.add(h);g.position.set(-7+i*7,0,-8);scene.add(g);shoppers.push({g,phase:i*.9})});
camera.position.set(0,4,15);let money=120,stock=8,started=false,nearShelf=false,nearTill=false,last=0;const $=s=>document.querySelector(s);
function updateHUD(){$('#money').textContent=money;$('#count').textContent=stock}function say(t){$('#msg').textContent=t;$('#msg').style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>$('#msg').style.display='none',2100)}
function interact(){if(!started)return;if(nearShelf){if(stock<=0){say('No stock left!');return}stock--;money+=4;updateHUD();say('Shelf restocked! +$4')}else if(nearTill){money+=12;updateHUD();say('Customer served! +$12')}else say('Move closer to a shelf or checkout.')}
$('#restock').onclick=interact;$('#checkout').onclick=()=>{if(nearTill){money+=12;updateHUD();say('Sale completed! +$12')}else say('Walk to the checkout first.')};$('#start').onclick=()=>{$('#overlay').style.display='none';started=true;say('Store is OPEN!')};
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0},drag=false;const stick=$('#stick'),knob=$('#knob');function moveJoy(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),max=34;if(d>max){dx*=max/d;dy*=max/d}joy={x:dx/max,y:dy/max};knob.style.transform=`translate(${dx}px,${dy}px)`}stick.onpointerdown=e=>{drag=true;stick.setPointerCapture(e.pointerId);moveJoy(e)};stick.onpointermove=e=>{if(drag)moveJoy(e)};function stop(){drag=false;joy={x:0,y:0};knob.style.transform=''}stick.onpointerup=stop;stick.onpointercancel=stop;
function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.04)||0;last=t;if(started){let x=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(x,z);if(len>1){x/=len;z/=len}player.position.x=THREE.MathUtils.clamp(player.position.x+x*5*dt,-10,10);player.position.z=THREE.MathUtils.clamp(player.position.z+z*5*dt,-10,10);if(len>.05)player.rotation.y=Math.atan2(x,z);camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x,dt*3);camera.position.z=THREE.MathUtils.lerp(camera.position.z,player.position.z+5,dt*3);camera.lookAt(player.position.x,1,player.position.z-3);nearShelf=shelfSpots.some(([sx,sz])=>Math.hypot(player.position.x-sx,player.position.z-sz)<2.3);nearTill=Math.hypot(player.position.x,player.position.z-8)<3;$('#hint').textContent=nearShelf?'Near a shelf — tap RESTOCK':nearTill?'At checkout — tap CHECKOUT':'Explore the store and help your customers';shoppers.forEach(s=>{s.phase+=dt*.45;s.g.position.x=Math.sin(s.phase)*7;s.g.position.z=-7+Math.cos(s.phase)*1.5})}renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
